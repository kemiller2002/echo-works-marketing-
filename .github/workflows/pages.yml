name: Verify and publish EchoWorks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install checksum-pinned, brand-neutral Forma
        uses: kemiller2002/forma/actions/install-presentation@v0.4.1
        with:
          lock: forma.lock
      - name: Run checks and assemble site
        run: bash build.sh
      - name: Check whether GitHub Pages is enabled
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Build passed. To publish, set Settings > Pages > Source to GitHub Actions, then rerun."
          fi
      - name: Configure Pages
        if: steps.pages.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  ui-conformance:
    # visual-engineering/UI-LAYOUT-INTERACTION@1.0.0 browser evidence for the built site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install checksum-pinned, brand-neutral Forma
        uses: kemiller2002/forma/actions/install-presentation@v0.4.1
        with:
          lock: forma.lock
      - name: Install test tooling
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build and run UI conformance suite
        run: npm run ui:conformance
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-conformance-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages-ready == 'true'
    needs: [build, ui-conformance]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
